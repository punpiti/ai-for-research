name: Test installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-installers.sh
      - run: bash scripts/audit-public.sh

  unix-behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        agent: [codex, claude, openrouter, antigravity]
        state: [present, missing, no-npm, no-code]
        include:
          - os: ubuntu-latest
            installer: downloads/setup-linux.sh
          - os: macos-latest
            installer: downloads/setup-macos.sh
        exclude:
          - agent: antigravity
            state: no-npm
          - agent: antigravity
            state: no-code
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-installer-behavior.sh "${{ matrix.installer }}" "${{ matrix.agent }}" "${{ matrix.state }}"

  module-7-8-platforms:
    # Learner-facing Module 7/8 bootstraps on the platforms testers use:
    # macOS stock bash 3.2 and Windows PowerShell 5.1 (not pwsh).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-module-7-8-platforms.py
        if: runner.os != 'Windows'
      - run: python scripts/test-module-7-8-platforms.py
        if: runner.os == 'Windows'
        shell: powershell

  windows-behavior:
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, claude, openrouter, antigravity]
        state: [present, missing, no-npm, no-code]
        exclude:
          - agent: antigravity
            state: no-npm
          - agent: antigravity
            state: no-code
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/test-installer-behavior.ps1 -Agent "${{ matrix.agent }}" -State "${{ matrix.state }}"
      - shell: powershell
        run: ./scripts/test-windows-system-tools.ps1
      - shell: powershell
        run: ./scripts/test-windows-uninstall.ps1
