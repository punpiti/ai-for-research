<section class="prepare-hero module-hero"><p class="eyebrow">หัวข้อย่อย · M01</p><h1>แนะนำคลาส</h1></section>
<div class="topic-layout"><nav class="topic-tabs topic-menu" aria-label="ในหัวข้อนี้"><p class="topic-menu-title">ในหัวข้อนี้</p><ul><li><a href="#slides" title="สไลด์">สไลด์</a></li></ul></nav><div class="topic-main"><section class="section markdown-section topic-panel" id="slides" aria-labelledby="slides-heading"><div class="section-heading compact"><p class="eyebrow">สไลด์</p><h2 id="slides-heading">สไลด์</h2></div><div class="markdown-body"><p>สไลด์ของหัวข้อนี้ยังไม่เสร็จ</p></div></section></div></div>
<script>
(() => {
  const tabs = [...document.querySelectorAll('.topic-tabs > ul > li > a')];
  const panels = tabs.map(t => document.getElementById(t.hash.slice(1)));
  const subs = [...document.querySelectorAll('.topic-tabs a[data-sub]')];
  const idOf = a => decodeURIComponent(a.getAttribute('href').slice(1));  // .hash is percent-encoded for Thai ids
  function show(id) {
    const target = id && document.getElementById(id);
    const owner = target && target.closest('.topic-panel');
    const i = Math.max(0, panels.findIndex(p => p && p.id === (owner ? owner.id : id)));
    panels.forEach((p, k) => { if (p) p.hidden = k !== i; });
    tabs.forEach((t, k) => { t.setAttribute('aria-current', k === i ? 'page' : 'false'); t.parentElement.classList.toggle('is-open', k === i); });
    const layout = document.querySelector('.topic-layout'); if (layout && panels[i]) layout.dataset.active = panels[i].id;
    return target && owner && target !== owner ? target : null;
  }
  tabs.forEach(t => t.addEventListener('click', e => { e.preventDefault(); history.replaceState(null, '', t.hash); show(t.hash.slice(1)); window.scrollTo({top: 0}); }));
  subs.forEach(s => s.addEventListener('click', e => { e.preventDefault(); history.replaceState(null, '', s.hash); const h = show(idOf(s)); if (h) h.scrollIntoView({block: 'start'}); }));
  if ('IntersectionObserver' in window && subs.length) {  // highlight the step being read
    const byId = new Map(subs.map(s => [idOf(s), s]));
    const seen = new Set();
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) seen.add(en.target.id); else seen.delete(en.target.id); });
      const visible = [...byId.keys()].find(k => seen.has(k));
      if (visible) subs.forEach(s => s.classList.toggle('is-here', s === byId.get(visible)));
    }, {rootMargin: '-15% 0px -70% 0px'});
    byId.forEach((_, k) => { const h = document.getElementById(k); if (h) io.observe(h); });
  }
  document.querySelectorAll('[data-next-tab]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); const h = b.getAttribute('href'); history.replaceState(null, '', h); show(h.slice(1)); window.scrollTo({top: 0}); }));
  document.querySelectorAll('[data-fullscreen]').forEach(b => b.addEventListener('click', () => {
    const frame = document.querySelector(b.dataset.fullscreen);
    const go = frame && (frame.requestFullscreen || frame.webkitRequestFullscreen);
    if (go) go.call(frame); else if (frame) window.open(frame.src, '_blank', 'noopener');
  }));
  const layout0 = document.querySelector('.topic-layout');
  const toggle = document.querySelector('[data-aside-toggle]');
  function setAside(hidden) {
    if (!layout0 || !toggle) return;
    layout0.classList.toggle('aside-hidden', hidden);
    toggle.setAttribute('aria-pressed', String(hidden));
    toggle.textContent = hidden ? 'แสดงสไลด์ข้าง' : 'ซ่อนสไลด์ข้าง';
    try { localStorage.setItem('airr.slideAsideHidden', hidden ? '1' : '0'); } catch (e) {}
  }
  if (toggle) {
    let saved = true; try { saved = localStorage.getItem('airr.slideAsideHidden') !== '0'; } catch (e) {}  // hidden by default
    setAside(saved);
    toggle.addEventListener('click', () => setAside(!layout0.classList.contains('aside-hidden')));
  }
  let hashId = location.hash.slice(1); try { hashId = decodeURIComponent(hashId); } catch (e) {}
  const deep = show(hashId);
  if (location.hash) requestAnimationFrame(() => deep ? deep.scrollIntoView({block: 'start'}) : window.scrollTo({top: 0}));
})();
</script>
